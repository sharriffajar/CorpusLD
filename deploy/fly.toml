# Fly.io deployment configuration for CorpusLD Studio (Hosted Web Track)
app = "corpusld-studio"
primary_region = "sin"

[build]
  dockerfile = "docker/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "15s"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

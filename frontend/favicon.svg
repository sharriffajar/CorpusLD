<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="node-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="node-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Connecting Edges -->
  <!-- Outer Ring Edges -->
  <line x1="32" y1="13" x2="49" y2="23" stroke="#334155" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="49" y1="23" x2="49" y2="43" stroke="#334155" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="49" y1="43" x2="32" y2="53" stroke="#334155" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="32" y1="53" x2="15" y2="43" stroke="#334155" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="15" y1="43" x2="15" y2="23" stroke="#334155" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="15" y1="23" x2="32" y2="13" stroke="#334155" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Radial Edges to Center Node -->
  <line x1="32" y1="13" x2="32" y2="33" stroke="#38bdf8" stroke-width="1.75" stroke-opacity="0.85" stroke-linecap="round"/>
  <line x1="49" y1="23" x2="32" y2="33" stroke="#34d399" stroke-width="1.75" stroke-opacity="0.85" stroke-linecap="round"/>
  <line x1="49" y1="43" x2="32" y2="33" stroke="#38bdf8" stroke-width="1.75" stroke-opacity="0.85" stroke-linecap="round"/>
  <line x1="32" y1="53" x2="32" y2="33" stroke="#34d399" stroke-width="1.75" stroke-opacity="0.85" stroke-linecap="round"/>
  <line x1="15" y1="43" x2="32" y2="33" stroke="#38bdf8" stroke-width="1.75" stroke-opacity="0.85" stroke-linecap="round"/>
  <line x1="15" y1="23" x2="32" y2="33" stroke="#34d399" stroke-width="1.75" stroke-opacity="0.85" stroke-linecap="round"/>

  <!-- Cross Interconnects -->
  <line x1="15" y1="23" x2="49" y2="43" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="49" y1="23" x2="15" y2="43" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Outer Satellite Nodes -->
  <circle cx="32" cy="13" r="4.2" fill="url(#node-emerald)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="49" cy="23" r="4.2" fill="url(#node-cyan)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="49" cy="43" r="4.2" fill="url(#node-emerald)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="32" cy="53" r="4.2" fill="url(#node-cyan)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="15" cy="43" r="4.2" fill="url(#node-emerald)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="15" cy="23" r="4.2" fill="url(#node-cyan)" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Central Hub Node -->
  <circle cx="32" cy="33" r="5.5" fill="url(#node-indigo)" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="32" cy="33" r="2.2" fill="#ffffff"/>
</svg>
